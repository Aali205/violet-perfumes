<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="فيوليت: المكان الأول لبيع البيرفيوم الأورجينال في دمشق، الشعلان جانب بنك بيبلوس. توصيل في دمشق وشحن لكافة أنحاء سوريا.">
  <meta name="theme-color" content="#1c0a26">
  <meta property="og:title" content="Violet Perfumes, Damascus">
  <meta property="og:image" content="assets/violet-logo.jpg">
  <link rel="icon" href="assets/violet-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Marcellus&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=7">
  <script>
    // Play the logo intro on a refresh or when arriving from outside the site;
    // skip it when coming here from another page of the site (menu, logo, back button).
    (function () {
      var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
      var type = nav ? nav.type : 'navigate';
      var internal = false;
      try { internal = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) {}
      if (type === 'reload' || !internal) document.documentElement.classList.add('intro-on');
    })();
  </script>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body class="page-home">
  <div id="intro" class="intro" aria-hidden="true">
    <div class="intro-logo">
      <svg class="intro-bottle" viewBox="0 0 400 480" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
        <defs>
          <mask id="intro-cut" maskUnits="userSpaceOnUse" x="-20" y="-20" width="440" height="520">

            <rect class="intro-band" x="-20" y="252" width="440" height="100" fill="#000"/>
          </mask>
        </defs>
        <g mask="url(#intro-cut)">
        <path class="d1" pathLength="1" d="M145 10H255L270 25V65L255 80H145L130 65V25Z"/>
        <path class="d2" pathLength="1" d="M151 18H249L262 31V59L249 72H151L138 59V31Z"/>
        <rect class="d3" pathLength="1" x="150" y="88" width="100" height="30" rx="15"/>
        <path class="d4" pathLength="1" d="M160 118V152M240 118V152M160 130H240M160 141H240"/>
        <path class="d5" pathLength="1" d="M70 152H330L362 184V440L330 472H70L38 440V184Z"/>

        <path class="d7" pathLength="1" stroke-width="2.4" d="M150 446C100 440 70 406 62 356"/>

      <p class="intro-word" lang="en"><span>V</span><span>I</span><span>O</span><span>L</span><span>E</span><span>T</span></p>
      <div class="intro-mist"></div>
    </div>
  </div>
  <a class="skip" href="#shop">تخطَّ إلى العطور</a>

  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Violet">
      <img src="assets/violet-mark.svg" alt="" class="brand-mark"><span>VIOLET</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="#shop" data-i18n="nav.shop">العطور</a>
      <a href="brands.html" data-i18n="nav.brands">الماركات</a>
      <a href="#visit" data-i18n="nav.visit">زورونا</a>
      <a class="btn btn-small nav-cta" data-link="whatsapp" target="_blank" rel="noopener" data-i18n="cta.whatsapp">اطلب على واتساب</a>
    </nav>
    <button class="lang-toggle" type="button" data-i18n="lang">EN</button>
    <button class="menu-btn" type="button" aria-expanded="false" aria-label="Menu"><span></span><span></span></button>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <canvas id="hero-canvas" aria-hidden="true"></canvas>
      <div class="hero-copy">
        <img class="hero-mark" src="assets/violet-mark.svg" alt="">
        <p class="hero-word" lang="en">VIOLET</p>
        <h1 id="hero-title" data-i18n="hero.title">عطرك الأصلي، من الشعلان لكل سوريا</h1>
        <p class="hero-sub" data-i18n="hero.sub"></p>
        <div class="hero-actions">
          <a class="btn" href="brands.html" data-i18n="cta.brands">تصفّح الماركات</a>
          <a class="btn btn-ghost" data-link="whatsapp" target="_blank" rel="noopener" data-i18n="cta.whatsapp">اطلب على واتساب</a>
        </div>
      </div>
      <p class="hero-hint" data-i18n="hero.hint"></p>
    </section>

    <div class="ribbon" aria-label="Brands">
      <div class="ribbon-track"></div>
    </div>

    <section id="shop" class="shop" aria-labelledby="shop-title">
      <div class="shop-head">
        <h2 id="shop-title" data-reveal data-i18n="shop.title">على رفوفنا هلّق</h2>
        <p data-i18n="shop.sub"></p>
      </div>
      <div class="filters">
        <div id="gender-filters" class="seg" role="radiogroup" aria-label="Gender"></div>
        <div id="accord-filters" class="accords" aria-label="Accords"></div>
        <output id="shop-count" class="shop-count" aria-live="polite"></output>
      </div>
      <ul id="shop-grid" class="shop-grid"></ul>
    </section>

    <section class="bbw" aria-labelledby="bbw-title">
      <div class="bbw-copy">
        <img class="bbw-logo" src="assets/logos/bbw.svg" alt="">
        <h2 id="bbw-title" data-reveal data-i18n="bbw.title" lang="en">Bath &amp; Body Works</h2>
        <p data-i18n="bbw.sub"></p>
        <p class="bbw-price"><strong lang="en">$12</strong> <span data-i18n="bbw.price"></span></p>
        <button class="btn btn-light" type="button" data-open-brand="bbw" data-i18n="bbw.cta"></button>
      </div>
      <div class="bbw-stack">
        <img src="assets/img/bbw/14.webp" alt="" loading="lazy">
        <img src="assets/img/bbw/17.webp" alt="" loading="lazy">
        <img src="assets/img/bbw/19.webp" alt="" loading="lazy">
      </div>
    </section>

    <section id="visit" class="visit" aria-labelledby="visit-title">
      <div class="visit-photos">
        <img class="visit-front" src="assets/img/store/00.webp" alt="واجهة محل فيوليت بالشعلان" loading="lazy">
        <img class="visit-inside" src="assets/img/store/03.webp" alt="رفوف العطور داخل المحل" loading="lazy">
      </div>
      <div class="visit-copy">
        <h2 id="visit-title" data-reveal data-i18n="visit.title">زورونا بالشعلان</h2>
        <address data-i18n="visit.addr">دمشق، الشعلان، جانب بنك بيبلوس</address>
        <ul class="visit-facts">
          <li data-i18n="visit.f1"></li>
          <li data-i18n="visit.f2"></li>
          <li data-i18n="visit.f3"></li>
        </ul>
        <p class="visit-phone"><a data-link="whatsapp" target="_blank" rel="noopener" dir="ltr" data-phone></a></p>
        <div class="visit-actions">
          <a class="btn" data-link="whatsapp" target="_blank" rel="noopener" data-i18n="cta.whatsapp"></a>
          <a class="btn btn-ghost" href="tel:+963959587754" data-i18n="visit.call"></a>
          <a class="btn btn-ghost" data-link="map" target="_blank" rel="noopener" data-i18n="visit.map"></a>
        </div>
      </div>
      <iframe class="visit-map" title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=Byblos%20Bank%20Al%20Shaalan%20Damascus&amp;output=embed"></iframe>
    </section>
  </main>

  <footer class="site-footer">
    <img src="assets/violet-mark.svg" alt="" class="footer-mark">
    <p data-i18n="foot.line"></p>
    <p class="footer-links">
      <a data-link="instagram" target="_blank" rel="noopener" lang="en">@violeet_perfumess</a>
      <a data-link="whatsapp" target="_blank" rel="noopener" dir="ltr">+963 959 587 754</a>
    </p>
  </footer>

  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Photos" hidden>
    <div class="viewer-stage">
      <div class="viewer-bars"></div>
      <div class="viewer-top">
        <img class="viewer-logo" alt="">
        <span class="viewer-name"></span>
        <button class="viewer-close" type="button" data-i18n-aria="viewer.close" aria-label="إغلاق">×</button>
      </div>
      <img class="viewer-photo" alt="">
      <button class="viewer-prev" type="button" aria-label="Previous"></button>
      <button class="viewer-next" type="button" aria-label="Next"></button>
      <a class="btn viewer-ask" target="_blank" rel="noopener" data-i18n="viewer.ask"></a>
    </div>
  </div>

  <script src="js/intro.js?v=1"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script type="module" src="js/main.js?v=7"></script>
  <script type="module" src="js/hero.js?v=7"></script>
  <script type="module">
    import { openViewer } from './js/main.js?v=7';
    document.querySelectorAll('[data-open-brand]').forEach((b) =>
      b.addEventListener('click', () => openViewer(b.dataset.openBrand, 0, b)));
  </script>
</body>
</html>
